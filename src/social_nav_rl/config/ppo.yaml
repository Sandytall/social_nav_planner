# PPO hyperparameters (Stable-Baselines3). Reasonable starting values for the continuous
# social-nav control task; tune from the training logs. Only SB3-accepted keys are read.
n_steps: 2048
batch_size: 256
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
learning_rate: 0.0002
# ent_coef > 0 keeps the policy exploring: with 0.0 the action std collapses and the policy
# falls into the "stand still to avoid collisions" local optimum (episodes time out, reward
# goes negative). 0.005 is a mild bonus that prevents that without stopping convergence.
ent_coef: 0.005
vf_coef: 0.5
clip_range: 0.2
max_grad_norm: 0.5
# target_kl early-stops an update epoch if the policy moves too far in one step, guarding
# against the aggressive updates that precede a collapse (clip_fraction / approx_kl spiking).
target_kl: 0.03
