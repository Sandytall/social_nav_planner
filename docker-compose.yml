# SocialNav Planner — Docker Compose (MASTER_PROMPT §40).
#
#   docker compose build
#   # headless demo:
#   docker compose run --rm socialnav
#   # with Gazebo/RViz GUI (share X11 first on the host):
#   xhost +local:root
#   docker compose run --rm socialnav bash -lc "HUMANS='-1.3,-0.7,0,0' ./scripts/run_demo.sh"
#
# GPU: uncomment the `deploy`/`runtime` block if you have the NVIDIA container toolkit.
services:
  socialnav:
    build: .
    image: social-nav:humble
    network_mode: host          # simplest DDS discovery
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # --- NVIDIA GPU (needs nvidia-container-toolkit) ---
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    stdin_open: true
    tty: true
